{% extends "base.html" %}

{% block title %}Karnataka Crop Market Directions - AgroSmart{% endblock %}

{% block content %}
<section class="panel map-direction-panel">
    <h2>Karnataka Crop Market Directions</h2>
    <p><strong>Registered location:</strong> {{ user_location }}</p>

    <label for="district-select">District</label>
    <select id="district-select" class="district-select">
        {% for district in karnataka_districts %}
            <option value="{{ district }}">{{ district }}</option>
        {% endfor %}
    </select>

    <button id="enable-location" class="button highlighted-map-link location-enable-button" type="button">
        Enable Live GPS Location
    </button>
    <div id="geolocation-status" class="geolocation-status">Waiting for live current location...</div>
    <div id="route-summary" class="route-summary"></div>
    <div id="market-actions" class="district-market-list"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const districtMarkets = {{ district_markets|tojson }};
    const districtSelect = document.getElementById('district-select');
    const enableLocationButton = document.getElementById('enable-location');
    const geolocationStatus = document.getElementById('geolocation-status');
    const routeSummary = document.getElementById('route-summary');
    const marketActions = document.getElementById('market-actions');
    const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    let currentCoords = null;
    let locationWatchId = null;

    function showGeoStatus(message, error = false) {
        geolocationStatus.textContent = message;
        geolocationStatus.style.color = error ? '#b00020' : '';
    }

    function locationHelpText() {
        return isMobileDevice
            ? 'Turn on phone GPS/location services and allow location permission for this browser.'
            : 'Allow browser location permission. On laptops/desktops, turn on system location services or connect to Wi-Fi for better location.';
    }

    function originText() {
        return currentCoords ? `${currentCoords.lat},${currentCoords.lng}` : '';
    }

    function googleMarketDirectionsUrl(origin, destination) {
        const params = new URLSearchParams({
            api: '1',
            destination,
            travelmode: 'driving'
        });
        if (origin) {
            params.set('origin', origin);
        }
        return `https://www.google.com/maps/dir/?${params.toString()}`;
    }

    function openGoogleMaps(url) {
        window.location.assign(url);
    }

    function setLiveCoords(position) {
        currentCoords = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: Math.round(position.coords.accuracy || 0)
        };
    }

    function renderMarkets() {
        const district = districtSelect.value;
        const markets = districtMarkets[district] || [];

        routeSummary.innerHTML = currentCoords
            ? `<div class="route-summary-header"><strong>${district} markets</strong></div><p>Directions will start from your live GPS location: <strong>${currentCoords.lat.toFixed(5)}, ${currentCoords.lng.toFixed(5)}</strong>.</p>`
            : `<p class="form-error">${locationHelpText()}</p>`;

        marketActions.innerHTML = markets.map(market => {
            return `
                <button class="button highlighted-map-link market-direction-link"
                   type="button"
                   data-market="${market.query}">
                    ${market.name} Directions
                </button>
            `;
        }).join('');

        marketActions.querySelectorAll('.market-direction-link').forEach(link => {
            link.addEventListener('click', () => openDirectionsFromFreshLiveLocation(link.dataset.market));
        });
    }

    function openDirectionsFromFreshLiveLocation(marketQuery) {
        requestLiveLocation(
            () => {
                const url = googleMarketDirectionsUrl(originText(), marketQuery);
                openGoogleMaps(url);
            },
            () => {
                const fallbackUrl = googleMarketDirectionsUrl('', marketQuery);
                openGoogleMaps(fallbackUrl);
            }
        );
    }

    function startLocationWatch() {
        if (locationWatchId || !navigator.geolocation || !currentCoords) {
            return;
        }

        locationWatchId = navigator.geolocation.watchPosition(position => {
            setLiveCoords(position);
            showGeoStatus('Live GPS tracking is active.');
            renderMarkets();
        }, () => {
            showGeoStatus(`Live location tracking stopped. ${locationHelpText()}`, true);
        }, {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        });
    }

    function requestLiveLocation(onSuccess, onFailure) {
        if (!navigator.geolocation) {
            showGeoStatus('This browser does not support live location tracking.', true);
            if (onFailure) onFailure();
            return;
        }

        if (!window.isSecureContext) {
            showGeoStatus('Live location works only on HTTPS or localhost. Open this app on localhost or HTTPS.', true);
            if (onFailure) onFailure();
            return;
        }

        enableLocationButton.disabled = true;
        showGeoStatus(`${locationHelpText()} Waiting for browser permission...`);

        navigator.geolocation.getCurrentPosition(position => {
            setLiveCoords(position);
            enableLocationButton.textContent = 'Live GPS Enabled';
            showGeoStatus(`Live GPS location enabled. Accuracy about ${currentCoords.accuracy || 'unknown'} meters.`);
            renderMarkets();
            startLocationWatch();
            if (onSuccess) onSuccess();
        }, error => {
            const denied = error && error.code === error.PERMISSION_DENIED;
            enableLocationButton.disabled = false;
            enableLocationButton.textContent = 'Enable Live GPS Location';
            showGeoStatus(
                denied
                    ? `Location permission was denied. ${locationHelpText()}`
                    : `Unable to get live location. ${locationHelpText()}`,
                true
            );
            renderMarkets();
            if (onFailure) onFailure();
        }, {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        });
    }

    districtSelect.addEventListener('change', renderMarkets);
    enableLocationButton.addEventListener('click', () => requestLiveLocation());

    renderMarkets();
</script>
{% endblock %}
